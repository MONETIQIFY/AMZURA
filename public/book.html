<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Call — AMZURA Mentorship</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/Pq6d1w09/PHOTO-2026-08-18-22-37-23.jpg" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><img class="brand-logo-img" src="https://i.postimg.cc/Pq6d1w09/PHOTO-2026-08-18-22-37-23.jpg" alt="AMZURA — Amazon FBA Coaching" data-logo /><span class="brand-fallback"><span class="emblem">A</span><span class="wordmark"><span class="amz">AMZ</span><span class="ura">URA</span></span></span></a>
      <a class="btn btn-ghost" href="/">← Back to site</a>
    </div>
  </header>

  <main class="section container">
    <div class="section-head">
      <span class="eyebrow">Strategy call</span>
      <h2>Book your free mentorship call</h2>
      <p>Pick any open slot below — it syncs live with the mentors' Google Calendar, so every time shown is really available.</p>
    </div>
    <div id="refBadgeWrap" style="text-align:center;margin-bottom:20px;"></div>

    <!-- Cal.com inline embed -->
    <div class="cal-embed">
      <div id="my-cal-inline" style="width:100%;height:100%;min-height:640px;overflow:scroll"></div>
    </div>
    <p class="form-note" style="margin-top:20px;">Trouble seeing the calendar? <a id="calFallback" href="#" target="_blank" rel="noopener">Open it in a new tab</a></p>
  </main>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
    // Official Cal.com embed loader
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal; let ar = arguments;
        if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; }
        if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || [];
          if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); }
          else p(cal, ar); return; }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    function initCal(calLink, prefill) {
      document.getElementById("calFallback").href = "https://cal.com/" + calLink;
      Cal("init", "strategy", { origin: "https://app.cal.com" });
      Cal.ns.strategy("inline", {
        elementOrSelector: "#my-cal-inline",
        calLink: calLink,
        layout: "month_view",
        config: prefill,
      });
      Cal.ns.strategy("ui", {
        theme: "dark",
        cssVarsPerTheme: { dark: { "cal-brand": "#2f6bff" }, light: { "cal-brand": "#2f6bff" } },
        hideEventTypeDetails: false,
        layout: "month_view",
      });
    }

    document.addEventListener("amzura:config", function () {
      var aff = (window.AMZURA.getAffiliate && window.AMZURA.getAffiliate()) || {};
      var link = window.AMZURA.calcomLink || "yourteam/strategy-call";
      // Pass affiliate + tracking into the booking so it shows up on the event
      var prefill = {};
      if (aff.ref) {
        prefill = { metadata: { affiliate: aff.ref, landing: aff.landing || "" }, notes: "Referred by: " + aff.ref };
        document.getElementById("refBadgeWrap").innerHTML =
          '<span class="badge-ref">Referred by ' + aff.ref.replace(/[<>&]/g, "") + "</span>";
      }
      initCal(link, prefill);
    });
    // If config already loaded before listener attached
    if (window.AMZURA && window.AMZURA.loaded) document.dispatchEvent(new CustomEvent("amzura:config"));
  </script>
</body>
</html>
